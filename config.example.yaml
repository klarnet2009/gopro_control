server:
  host: 127.0.0.1
  port: 8000

poll_interval_sec: 2

# ATEM integration: auto-discovers via mDNS when atem_host is omitted/null.
# Set atem_host to skip discovery and connect directly (useful if mDNS is blocked).
# atem_host: "192.168.1.50"

cameras:
  - id: cam-front
    name: "Front Camera"
    target: "1234"      # last 4 chars of camera serial (Settings → About → Camera Info)
    mode: "ble"         # ble | cohn | ble+cohn
                      #   ble      — fast BLE control only (start/stop/status)
                      #   cohn     — HTTP over Wi-Fi; clock sync, live preview; requires provisioning
                      #   ble+cohn — dual transport: BLE for control, Wi-Fi for preview + clock sync
  - id: cam-side
    name: "Side Camera"
    target: "5678"
    mode: "ble"
